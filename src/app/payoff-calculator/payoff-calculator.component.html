<calcite-button icon-start="calculator" label="Payment Calculator" title="Payment Calculator" (click)="open();calculatePayoff()"></calcite-button>
<calcite-dialog modal heading="Payoff Quote" [open]="dialogOpen" (calciteDialogClose)="dialogOpen = false">
  <calcite-label>
    Payoff Date
    <calcite-input-date-picker name="payoffDate"
      [min]="minDate | date:'yyyy-MM-dd'"
      [value]="payoffDate | date:'yyyy-MM-dd'" (calciteInputDatePickerChange)="dateChanged($event.target.value)" required></calcite-input-date-picker>
  </calcite-label>
  <div #payoffInfo class="payoff-info">
    <div>Principal Due: {{principalDue | currency}}</div>
    <div>Daily Interest: {{dailyRate | currency}}</div>
    <!-- <div *ngIf="fromDate">{{fromDateLabel}}{{fromDate | date: 'MM/dd/yyyy'}}</div> -->
    <div>Interest Due: {{interestDue | currency}}</div>
    <div>Total Due: {{totalDue | currency}}</div>
  </div>
  @if (source === 'form') {
    <calcite-label>
      Payment Amount
      <calcite-input-number name="paymentAmount" [value]="paymentAmount?.toString() ?? ''" (calciteInputNumberInput)="paymentAmount = +$event.target.value" required></calcite-input-number>
    </calcite-label>
    <calcite-button slot="footer-end" (click)="save(); dialogOpen = false">Save</calcite-button>
  }
  <calcite-button slot="footer-end" appearance="outline" kind="neutral" (click)="dialogOpen = false">Close</calcite-button>
  <calcite-button slot="footer-end" appearance="outline" (click)="exportPayoff()">Export</calcite-button>
</calcite-dialog>
