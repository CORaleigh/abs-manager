<a class="btn  btn-green js-modal-toggle" title="Payment Calculator" href="#" data-modal="foo"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" class="svg-icon"><path d="M1 0v12h29.8V0H1zm27 9H4V3h24v6zM1 14v8h8v-8H1zm6 6H3v-4h4v4zm5-6v8h8v-8h-8zm6 6h-4v-4h4v4zm5-6v18h8V14h-8zm6 16h-4V16h4v14zM1 24v8h8v-8H1zm6 6H3v-4h4v4zm5-6v8h8v-8h-8zm6 6h-4v-4h4v4z"/></svg></a>
<div class="js-modal modal-overlay modifier-class" data-modal="foo">
        <div class="modal-content column-12" role="dialog" aria-labelledby="modal" role="dialog">
      
          <a class="js-modal-toggle right" href="#" aria-label="close-modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 32 32" class="svg-icon"><path d="M18.404 16l9.9 9.9-2.404 2.404-9.9-9.9-9.9 9.9L3.696 25.9l9.9-9.9-9.9-9.898L6.1 3.698l9.9 9.899 9.9-9.9 2.404 2.406-9.9 9.898z"/></svg>
          </a>
      
          <h3 class='trailer-half'>Payoff Quote</h3>
          <form><label>
            Payoff Date
            <input type="date" class="form-control" name="payoffDate"
            [ngModel]="payoffDate | date:'yyyy-MM-dd'" (ngModelChange)="payoffDate = $event"
            [value]="payoffDate | date:'yyyy-MM-dd'" #BirthDate="ngModel" required>    </label></form>
            <div #payoffInfo>
              <div>Principal Due: {{principalDue | currency}}</div>
              <div *ngIf="fromDate">{{fromDateLabel}}{{fromDate | date: 'MM/dd/yyyy'}}</div>
              <div>Interest Due: {{interestDue | currency}}</div>
              <div>Total Due: {{totalDue | currency}}</div>
            </div>
      
      
          <div class="text-right">
              <button class="btn"  (click)="calculatePayoff()">Calculate</button>
      
              <button class="btn js-modal-toggle">Close</button>
              <button class="btn"  (click)="exportPayoff()">Export</button>

          </div>
        </div>
      </div>
