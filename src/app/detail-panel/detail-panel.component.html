<div class="panel modifier-class" id="detailsPanel">
  <h4 class="trailer-half" id="detailsTitle">{{title}}</h4>
  <button class="btn  btn-green modifier-class account-details-button" *ngIf="update && detailButtons" id="billsButton"
    (click)="getRelatedFeatures($event.currentTarget.innerText)">Bills</button>
  <button class="btn  btn-green modifier-class account-details-button" *ngIf="update && detailButtons" id="commButton"
    (click)="getRelatedFeatures($event.currentTarget.innerText)">Communication</button>
  <button class="btn  btn-green modifier-class account-details-button" *ngIf="!update && detailButtons"
    id="paymentButton" (click)="getRelatedFeatures($event.currentTarget.innerText)">Payments</button>
    <a class="js-modal-toggle" title="Payment Calculator" href="#" data-modal="foo"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" class="svg-icon"><path d="M1 0v12h29.8V0H1zm27 9H4V3h24v6zM1 14v8h8v-8H1zm6 6H3v-4h4v4zm5-6v8h8v-8h-8zm6 6h-4v-4h4v4zm5-6v18h8V14h-8zm6 16h-4V16h4v14zM1 24v8h8v-8H1zm6 6H3v-4h4v4zm5-6v8h8v-8h-8zm6 6h-4v-4h4v4z"/></svg></a>

  <br />



  <div class="modifier-class trailer-2 js-tab-group" id="detailsTabs" *ngIf="update">
    <nav class="tab-nav">
      <a class="tab-title is-active js-tab link-green">Information</a>
      <a class="tab-title js-tab link-green">Update</a>
    </nav>
    <section class="tab-contents">
      <article class="tab-section js-tab-section is-active">
        <div #featureDiv></div>
      </article>
      <article class="tab-section js-tab-section">
        <div class="trailer-0">
          <app-form [feature]="feature" [formgroups]="formgroups" (formSubmitted)="submitted($event)"></app-form>
        </div>
      </article>
    </section>
  </div>
  <div id="createDiv" *ngIf="!update">
    <app-form [feature]="feature" [formgroups]="formgroups" [update]="update" (formSubmitted)="submitted($event)">
    </app-form>
  </div>
</div>

<div class="js-modal modal-overlay modifier-class" data-modal="foo">
  <div class="modal-content column-12" role="dialog" aria-labelledby="modal" role="dialog">

    <a class="js-modal-toggle right" href="#" aria-label="close-modal">
      <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 32 32" class="svg-icon"><path d="M18.404 16l9.9 9.9-2.404 2.404-9.9-9.9-9.9 9.9L3.696 25.9l9.9-9.9-9.9-9.898L6.1 3.698l9.9 9.899 9.9-9.9 2.404 2.406-9.9 9.898z"/></svg>
    </a>

    <h3 class='trailer-half'>Payoff Quote</h3>
    <form><label>
      Payoff Date
      <input type="date" class="form-control" id="payoffDate" name="payoffDate"
      [ngModel]="payoffDate | date:'yyyy-MM-dd'" (ngModelChange)="payoffDate = $event"
      [value]="payoffDate | date:'yyyy-MM-dd'" #BirthDate="ngModel" required>    </label></form>
      <div>Principal Due: {{principalDue | currency}}</div>
      <div *ngIf="fromDate">{{fromDateLabel}}{{fromDate | date: 'MM/dd/yyyy'}}</div>
      <div>Interest Due: {{interestDue | currency}}</div>
      <div>Total Due: {{totalDue | currency}}</div>


    <div class="text-right">
        <button class="btn"  (click)="calculatePayoff()">Calculate</button>

        <button class="btn js-modal-toggle">Close</button>
    </div>
  </div>
</div>
