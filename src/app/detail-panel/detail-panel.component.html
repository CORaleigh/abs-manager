<div class="panel" id="detailsPanel">
  <h4 id="detailsTitle">{{title}}</h4>
  @if (update && detailButtons) {
    <div class="detail-buttons">
      <calcite-button id="billsButton" (click)="getRelatedFeatures('BILLS')">Bills</calcite-button>
      <calcite-button id="commButton" (click)="getRelatedFeatures('COMMUNICATION')">Communication</calcite-button>
      <calcite-button id="commentsButton" (click)="getRelatedFeatures('COMMENTS')">Comments</calcite-button>
      <calcite-button id="paymentButton" (click)="getRelatedFeatures('PAYMENTS')">Payments</calcite-button>
      <app-payoff-calculator  [feature]="feature" [source]="'details-panel'"></app-payoff-calculator>
    </div>
  }

  @if (update) {
    <calcite-tabs id="detailsTabs">
      <calcite-tab-nav slot="title-group">
        <calcite-tab-title tab="information" selected>Information</calcite-tab-title>
        @if (shared.role === 'admin' && title != 'Bill Details') {
          <calcite-tab-title tab="update">Update</calcite-tab-title>
        }
      </calcite-tab-nav>
      <calcite-tab tab="information" selected>
        <arcgis-feature [graphic]="featureGraphic"></arcgis-feature>
      </calcite-tab>
      <calcite-tab tab="update">
        <app-form [feature]="feature" [layers]="layers"  (formSubmitted)="submitted($event)"></app-form>
      </calcite-tab>
    </calcite-tabs>
  }
  @if (!update) {
    <div id="createDiv">
      @if (title != 'Bill Details') {
        <app-form [feature]="feature" [layers]="layers"   [update]="update" (formSubmitted)="submitted($event)">
        </app-form>
      }
    </div>
  }
</div>
