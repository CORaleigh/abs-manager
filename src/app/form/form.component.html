<button  class="btn btn-green modifier-class" (click)="submit()">Submit</button>

@if (showAttributeLookup()) {
  <app-attribute-lookup (refreshForm)="refreshForm($event)" [sourceForm]="form" [layers]="layers" [accountType]="feature.layer.title"></app-attribute-lookup>
}


<button  class="btn  btn-green modifier-class" (click)="cancel()">Cancel</button>
@if (showPayoffCalculator()) {
  <app-payoff-calculator [source]="'form'" [feature]="feature" (payoffCalculated)="payoffCalculated($event)"></app-payoff-calculator>
}

@if (invalid.length) {
  <div class="invalid">
    Errors with following fields: {{invalid.toString()}}
  </div>
}
<div #formDiv></div>
