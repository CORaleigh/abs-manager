<button  class="btn btn-green modifier-class" (click)="submit()">Submit</button>

<app-attribute-lookup *ngIf="showAttributeLookup()" (refreshForm)="refreshForm($event)" [sourceForm]="form" [layers]="layers" [accountType]="feature.layer.title"></app-attribute-lookup>


<button  class="btn  btn-green modifier-class" (click)="cancel()">Cancel</button>

<app-payoff-calculator *ngIf="account && feature.layer.title.includes('Payments')" [source]="'form'" [feature]="feature" (payoffCalculated)="payoffCalculated($event)"></app-payoff-calculator>
<div *ngIf="invalid.length" class="invalid">
    Errors with following fields: {{invalid.toString()}}
</div>
<div #formDiv></div>
