<div class="form-actions">
  <calcite-button (click)="submit()">Submit</calcite-button>

  @if (showAttributeLookup()) {
    <app-attribute-lookup (refreshForm)="refreshForm($event)" [sourceForm]="form" [layers]="layers" [accountType]="feature.layer.title"></app-attribute-lookup>
  }

  <calcite-button appearance="outline" (click)="cancel()">Cancel</calcite-button>
  @if (showPayoffCalculator()) {
    <app-payoff-calculator [source]="'form'" [feature]="feature" (payoffCalculated)="payoffCalculated($event)"></app-payoff-calculator>
  }
</div>

@if (invalid.length) {
  <calcite-notice open kind="danger" width="full" class="invalid">
    <div slot="message">Errors with following fields: {{invalid.toString()}}</div>
  </calcite-notice>
}
<arcgis-feature-form #formEl group-display="sequential"></arcgis-feature-form>
