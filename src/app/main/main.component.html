@if (loaded) {
  <a class="skip-to-content" href="#skip-to-content">Skip To Content</a>
  <calcite-navigation class="top-nav fade-in" label="ABS Manager">
    <calcite-navigation-logo slot="logo" href="/" rel="home" heading="ABS Manager" thumbnail="assets/logo.svg" label="Raleighnc.gov logo"></calcite-navigation-logo>
    <calcite-dropdown slot="user" placement="bottom-end">
      <calcite-navigation-user slot="trigger" [fullName]="shared.user.username"></calcite-navigation-user>
      <calcite-dropdown-group selection-mode="multiple">
        <calcite-dropdown-item icon-start="brightness" [selected]="dark" (calciteDropdownItemSelect)="darkModeToggle()">Dark Mode</calcite-dropdown-item>
      </calcite-dropdown-group>
      <calcite-dropdown-group selection-mode="none">
        <calcite-dropdown-item icon-start="sign-out" (calciteDropdownItemSelect)="signOut()">Sign Out</calcite-dropdown-item>
      </calcite-dropdown-group>
    </calcite-dropdown>
  </calcite-navigation>
}
@if (loaded) {
  <main class="page fade-in" id="skip-to-content">
    <app-search [layers]="layers" (selectionMade)="selectionMade($event)" (selectionMadeMultiple)="selectionMadeMultiple($event)" (propertiesSelected)="propertiesSelected($event)" [basemap]="basemap"></app-search>
    <nav class="breadcrumbs" id="crumbs" aria-label="Breadcrumbs">
      @for (crumb of crumbs; track crumb; let i = $index) {
        <a class="crumb"
          [ngStyle]="{'display': (crumb.visible) ? 'block':'none'}" [ngClass]="{'is-active': crumb.active}"
        (click)="crumbClicked(crumb, i)">{{crumb.title}}</a>
      }
    </nav>
    @for (panel of accountPanels; track panel) {
      <div>
        <app-account-panel [title]="panel.title" [visible]="panel.visible" (accountSelected)="accountSelected($event)"
          (createFeatureClicked)="createFeatureClicked($event)" (formSubmitted)="formSubmitted()" (formCanceled)="formSubmitted()"  [update]="panel.update"
          [source]="selectedProperty" [layer]="panel.layer" [features]="panel.features" [fields]="panel.fields"
          [layers]="layers" [selectedFeature]="panel.selectedFeature" [headers]="panel.headers" [formgroups]="panel.formgroups"
          [showDetails]="panel.showDetails" (showRelatedTable)="showRelatedTable($event)"
        [detailsTitle]="panel.detailsTitle"></app-account-panel>
      </div>
    }
    @for (panel of detailPanels; track panel) {
      <div>
        <app-account-panel [title]="panel.title" [visible]="panel.visible" (accountSelected)="accountSelected($event)"
          (createFeatureClicked)="createFeatureClicked($event)" [update]="panel.update" [source]="selectedAccount"
          [layer]="panel.layer" [layers]="layers" [selectedFeature]="panel.selectedFeature"
          (showRelatedTable)="showRelatedTable($event)" [features]="panel.features" [fields]="panel.fields"
          [headers]="panel.headers" [formgroups]="panel.formgroups" [showDetails]="panel.showDetails"
        [detailsTitle]="panel.detailsTitle"></app-account-panel>
      </div>
    }
    <!-- <app-payment-button [enabled]="paymentEnabled" [layers]="accountLayers" [features]="paymentFeatures" (clicked)="paymentClicked()" (getPayments)="getPayments($event)"></app-payment-button> -->
  </main>
}
@if (loaded) {
  <footer class="footer fade-in">
    <img src="assets/logo-footer.svg" alt>
  </footer>
}
@if (!loaded) {
  <calcite-loader label="Loading" text="Loading..."></calcite-loader>
}
