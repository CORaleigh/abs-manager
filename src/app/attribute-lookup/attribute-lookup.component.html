        <div class="column-12">

          <nav class="breadcrumbs modifier-class">

            <a class="crumb link-green" [ngClass]="{'is-active': !create}" (click)="create = false"
            >Search</a>
            <a class="crumb link-green" [ngClass]="{'is-active': create}" *ngIf="create"
            >Create</a> 
            </nav>  
        </div>      
        <div *ngIf="!create">
            <div *ngFor="let section of sections">
                <div *ngIf="checkAccountType(section)">
                    <h4 >{{section.title.replace('ABS - ', '')}}</h4>
                    <form>
                        <div class="grid-container">
                           <div class="column-3" *ngFor="let field of section.fields; index as i; ">
                              <label>
                                {{section.inputs[i]}}
                                  <input type="text" class="form-control" [id]="field" [name]="field" (ngModelChange)="section[field] = $event" [ngModel]="section[field]"  [value]="section[field]" >    
                              </label>
                          </div>
                          <div class="column-3">
      
                              <label>
                                  <button class="btn search-button  btn-green modifier-class" (click)="searchSection(section)"  >Search</button>
                              </label>
                          </div>                              
                      </div>
                      </form>
                      <div *ngIf="!section.features.length" class="alert alert-full modifier-class is-active">
                          No resolutions found
                          <button class="btn" (click)="showCreationForm(section)" >CREATE</button>
    
                      </div>   
                      <div *ngIf="section.features.length" class="alert alert-full modifier-class is-active">
                          {{section.text}} 
                          <button class="btn" (click)="applyToFeature(section)">APPLY</button>
                      </div>                   
                </div>
            </div>
